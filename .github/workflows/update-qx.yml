name: 更新分流规则订阅资源

on:
  schedule:
    # 19:00 UTC = 次日 03:00 (UTC+8)
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-qx
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 同步上游规则
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/blackmatrix7/ios_rule_script.git
          git fetch --no-tags upstream master
          git merge --no-edit upstream/master

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 生成订阅资源
        run: python3 script/qxconf/gen_qx_conf.py

      - name: 提交并推送
        run: |
          git add qx v2rayn
          if git diff --cached --quiet; then
            echo "合并资源无变化"
          else
            # 只有生成时间戳变化时不产生提交
            # （.conf 的 "# UPDATED:" 与 .json 里带“生成于”的 remarks）
            changed=$(git diff --cached -U0 \
              | grep -E '^[+-]' \
              | grep -vE '^(\+\+\+|---)' \
              | grep -vcE '^[+-](# UPDATED:| *"remarks": ".*\| 生成于 )' || true)
            if [ "$changed" -eq 0 ]; then
              git restore --staged --worktree qx v2rayn
              echo "仅时间戳变化，跳过提交"
            else
              git commit -m "更新分流规则订阅资源 $(date -u -d '+8 hours' +'%Y-%m-%d')"
            fi
          fi
          git push origin HEAD:master

      - name: 同步到订阅分支
        continue-on-error: true
        run: |
          # 订阅链接用的是这个分支，合并后让它跟着 master 走，
          # 这样已经填进 Quantumult X 的分支链接不用改也能持续更新。
          git push origin HEAD:claude/quantumult-x-rules-conversion-jj9sgx
